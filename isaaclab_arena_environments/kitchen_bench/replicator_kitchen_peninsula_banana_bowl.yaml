env_name: droid_banana_to_bowl_kitchen_peninsula
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
background:
  id: kitchen
  registry_name: replicator_kitchen_peninsula
  params: {}
objects:
- id: banana
  registry_name: banana_ycb_robolab
  params: {}
- id: bowl
  registry_name: bowl_ycb_robolab
  params: {}
object_references:
- id: floor
  parent_id: kitchen
  prim_path: KitchenRoom/Floor
  object_type: base
  params: {}
- id: island_top
  parent_id: kitchen
  prim_path: CapSurface_02
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: island_top
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: island_top
  params:
    side: positive_y
    distance_m: 0.15
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: -1.57
- kind: 'on'
  subject: banana
  reference: island_top
  params: {}
- kind: 'on'
  subject: bowl
  reference: island_top
  params: {}
- kind: next_to
  subject: banana
  reference: bowl
  params:
    side: positive_x
    distance_m: 0.05
task:
  composition: atomic
  description: pick up the banana from the island counter and place it in the bowl
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: banana
      destination_location: bowl
      background_scene: kitchen
