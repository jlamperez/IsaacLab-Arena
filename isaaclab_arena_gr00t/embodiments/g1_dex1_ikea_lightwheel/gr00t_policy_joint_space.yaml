# Target group order for observation.state (33-wide), used by remap_sim_joints_to_policy_joints
# to regroup 33dof_joint_space.yaml's flat sim order into named policy groups. Mirrors
# ../g1/gr00t_43dof_joint_space.yaml's leg/waist/arm grouping, with the Dex1 2-joint gripper in
# place of the dexterous-hand 7-joint groups.
joints:
  left_leg:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
  right_leg:
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
  waist:
    - waist_yaw_joint
    - waist_roll_joint
    - waist_pitch_joint
  left_arm:
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint
  left_gripper:
    - left_dex1_finger_joint_1
    - left_dex1_finger_joint_2
  right_arm:
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint
  right_gripper:
    - right_dex1_finger_joint_1
    - right_dex1_finger_joint_2
